services:
  - type: web
    name: prime-sms-hub-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Node and Routing configurations
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      
      # The URL of your Vercel frontend(s) (e.g. https://your-app.vercel.app,https://your-admin.vercel.app)
      # Adding multiple comma separated could require a slight split in server.js but process.env handles it.
      - key: FRONTEND_URL
        fromService:
          type: static
          name: prime-sms-hub-frontend
          property: url
        
      # Security & SDK configurations
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIVESIM_PROTOCOL_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false

  - type: static
    name: prime-sms-hub-frontend
    env: static
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        value: https://api.primesmshub.space
      - key: VITE_APP_NAME
        value: PrimeSmsHub
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false
      - key: VITE_PAYSTACK_PUBLIC_KEY
        sync: false
