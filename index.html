<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- =====================================================
         PER-ROUTE SEO INJECTION
         Runs before React mounts so Googlebot sees unique
         title/description/canonical for every page.
    ====================================================== -->
    <script>
      (function () {
        var BASE = 'https://primesmshub.space';
        var path = window.location.pathname.replace(/\/$/, '') || '/';

        var pages = {
          '/':          { title: 'PrimeSmsHub – Premium SMS Verification & Virtual Numbers Worldwide', desc: 'PrimeSmsHub Global: Secure, fast, and reliable SMS verification service. Get virtual numbers for WhatsApp, Telegram, Google & more. Available worldwide at the best rates.' },
          '/signup':    { title: 'Create Your Free Account – PrimeSmsHub', desc: 'Sign up for PrimeSmsHub and get instant access to virtual numbers for SMS verification. Register free and top up your balance in seconds.' },
          '/login':     { title: 'Log In to PrimeSmsHub – Your SMS Verification Dashboard', desc: 'Log in to your PrimeSmsHub account to buy virtual numbers, track your orders, and manage your wallet.' },
          '/terms':     { title: 'Terms of Service – PrimeSmsHub', desc: 'Read the PrimeSmsHub Terms of Service. Understand the rules, policies, and guidelines that govern the use of our SMS verification platform.' },
          '/privacy':   { title: 'Privacy Policy – PrimeSmsHub', desc: 'Learn how PrimeSmsHub collects, uses, and protects your personal data. Your privacy is our priority.' },
        };

        var meta = pages[path] || pages['/'];
        // Canonical: Ensure no trailing slash for consistency (e.g. https://primesmshub.space)
        var canonical = BASE + (path === '/' ? '' : path);

        // Title
        document.title = meta.title;

        // Helper to set/create a <meta> tag
        function setMeta(attr, key, val) {
          var el = document.querySelector('meta[' + attr + '="' + key + '"]');
          if (!el) { el = document.createElement('meta'); el.setAttribute(attr, key); document.head.appendChild(el); }
          el.setAttribute('content', val);
        }

        // Helper to set/create a <link> tag
        function setLink(rel, val) {
          var el = document.querySelector('link[rel="' + rel + '"]');
          if (!el) { el = document.createElement('link'); el.setAttribute('rel', rel); document.head.appendChild(el); }
          el.setAttribute('href', val);
        }

        setMeta('name',     'description',       meta.desc);
        setLink('canonical', canonical);
        setMeta('property', 'og:url',            canonical);
        setMeta('property', 'og:title',          meta.title);
        setMeta('property', 'og:description',    meta.desc);
        setMeta('property', 'twitter:url',       canonical);
        setMeta('property', 'twitter:title',     meta.title);
        setMeta('property', 'twitter:description', meta.desc);
      })();
    </script>

    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- Robots: disallow auth-only pages -->
    <script>
      (function(){
        var path = window.location.pathname;
        if(path === '/dashboard' || path === '/verify-email'){
          var el = document.querySelector('meta[name="robots"]');
          if(el) el.setAttribute('content','noindex, nofollow');
        }
      })();
    </script>

    <!-- Shared SEO Tags (values overridden above per-route) -->
    <meta name="keywords" content="SMS verification, buy virtual numbers, receive sms online, disposable phone numbers, temporary numbers, WhatsApp verification, Telegram verification, PrimeSmsHub, PrimeSmsHub Global" />
    <meta name="author" content="PrimeSmsHub" />
    <link rel="alternate" hreflang="en" href="https://primesmshub.space" />
    <link rel="alternate" hreflang="x-default" href="https://primesmshub.space" />
    <link rel="alternate" hreflang="x-default" href="https://primesmshub.space" />

    <!-- Structured Data (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "PrimeSmsHub Global",
      "url": "https://primesmshub.space",
      "logo": "https://primesmshub.space/hero.png",
      "description": "Global secure virtual number provider for SMS verification. Available worldwide with the best rates.",
      "sameAs": []
    }
    </script>

    <!-- Sitelinks / Breadcrumb hint for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PrimeSmsHub",
      "url": "https://primesmshub.space",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://primesmshub.space/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Open Graph / Twitter (url, title, description set per-route by inline script above) -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://primesmshub.space/hero.png" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:image" content="https://primesmshub.space/hero.png" />

    <link rel="icon" type="image/png" href="/hero.png" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1753890020803101"
      crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
